<h1 class="titulo-detalhe">
  <i class="bi bi-person-add"></i> {{descTitulo}}
</h1>
<form>
  <div class="form-row" style="display: flex; gap: 12px; align-items: flex-end; margin-bottom: 18px;">
    <div class="form-group" style="flex: 3;">
      <label class="form-label fw-bold">
        <i class="bi bi-person"></i> Nome
      </label>
      <input type="text" class="form-control shadow-sm" name="nome" [(ngModel)]="funcionario.nome" placeholder="Digite o nome do funcionário" disabled />
    </div>
    <div class="form-group">
      <label class="form-label fw-bold">
        <i class="bi bi-person-badge"></i> Nome de Usuário
      </label>
      <input type="text" class="form-control shadow-sm" name="nomeUsuario" [(ngModel)]="funcionario.nomeUsuario" placeholder="Digite o nome de usuário" disabled />
    </div>
    <div class="form-group">
      <label class="form-label fw-bold">
        <i class="bi bi-telephone"></i> Telefone
      </label>
      <input type="text" class="form-control shadow-sm" name="telefone" [(ngModel)]="funcionario.telefone" placeholder="Digite o telefone" disabled />
    </div>
    <div class="form-group" style="flex: 2;">
      <label class="form-label fw-bold">
        <i class="bi bi-person-badge"></i> Perfil de Acesso
      </label>
      <select class="form-control shadow-sm" name="perfilAcesso" [(ngModel)]="funcionario.perfilAcesso" disabled>
        <option value="SuperAdministrador">Administrador</option>
        <option value="Administrador">Funcionário</option>
      </select>
    </div>
  </div>

  <div class="form-row" style="display: flex; gap: 12px; ">
    <div class="form-group">
      <label class="form-label fw-bold">
        <i class="bi bi-123"></i> CEP
      </label>
      <input type="text" class="form-control shadow-sm" name="cep" [(ngModel)]="funcionario.endereco.cep" placeholder="Digite o CEP" disabled />
    </div>
    <div class="form-group logradouro-group">
      <label class="form-label fw-bold d-flex align-items-center">
        <i class="bi bi-geo-alt me-1"></i> Logradouro
      </label>
      <input type="text" class="form-control shadow-sm" name="logradouro" [(ngModel)]="funcionario.endereco.logradouro" placeholder="Digite o logradouro" disabled />
    </div>
  </div>

  <div class="form-group">
    <label class="form-label fw-bold">
      <i class="bi bi-building"></i> Complemento
    </label>
    <input type="text" class="form-control shadow-sm" name="complemento" [(ngModel)]="funcionario.endereco.complemento" placeholder="Digite o complemento" disabled />
  </div>

  <div class="botoes-cadastro">
    <a class="btn btn-secondary" (click)="fecharModal()">
      <i class="bi bi-x-circle"></i> Fechar
    </a>
  </div>
</form>
