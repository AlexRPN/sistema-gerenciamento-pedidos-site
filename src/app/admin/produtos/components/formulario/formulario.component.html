<div class="container mt-5 rounded shadow-sm bg-light p-4" >
  <h1 class="text-center mb-4" style="color: #000;">
    <i class="bi bi-box-seam" ></i> {{descTitulo}}
  </h1>

  <form [formGroup]="produtoForm" (ngSubmit)="submit()">
    <div class="mt-3">
      <label class="form-label fw-bold"><i class="bi bi-image"></i> Imagem</label>
      <div class="mb-3">
        <div class="position-relative d-inline-block" *ngIf="previewUrl">
          <img [src]="previewUrl" class="img-thumbnail mb-2" style="max-height: 200px; max-width: 200px;">
          <button type="button" class="btn btn-danger btn-sm position-absolute top-0 end-0 m-1"
                  (click)="removerImagem()">
            <i class="bi bi-x-lg"></i>
          </button>
        </div>
        <input type="file" class="form-control shadow-sm" (change)="onFileSelected($event)"
        accept="image/*">
      </div>
    </div>

    <div class="mt-3">
      <label class="form-label fw-bold"><i class="bi bi-pencil-square"></i> Nome</label>
      <input type="text" class="form-control shadow-sm" formControlName="nome"
      [ngClass]="{'is-invalid': produtoForm.get('nome')?.invalid && produtoForm.get('nome')?.touched}"
      placeholder="Digite o nome do produto"
      >
      <div class="invalid-feedback">
        <span *ngIf="produtoForm.get('nome')?.invalid && produtoForm.get('nome')?.touched">
          O nome do produto é obrigatório
        </span>
      </div>
    </div>

    <div class="mt-3">
      <label class="form-label fw-bold"><i class="bi bi-card-text"></i> Descrição</label>
      <input type="text" class="form-control shadow-sm" formControlName="descricao"
      [ngClass]="{'is-invalid': produtoForm.get('descricao')?.invalid && produtoForm.get('descricao')?.touched}"
      placeholder="Digite a descrição do produto"
      >
      <div class="invalid-feedback">
        <span *ngIf="produtoForm.get('descricao')?.invalid && produtoForm.get('descricao')?.touched">
          A descrição do produto é obrigatório
        </span>
      </div>
    </div>

    <div class="row mt-3">
      <div class="col-md-3">
        <label class="form-label fw-bold"><i class="bi bi-currency-dollar"></i> Valor</label>
        <input type="text" class="form-control shadow-sm" formControlName="valor"
        [ngClass]="{'is-invalid': produtoForm.get('valor')?.invalid && produtoForm.get('valor')?.touched}"
        placeholder="Digite o valor do produto"
        >
        <div class="invalid-feedback">
          <span *ngIf="produtoForm.get('valor')?.invalid && produtoForm.get('valor')?.touched">
            O valor do produto é obrigatório
          </span>
        </div>
      </div>

      <div class="col-md-4 offset-md-1">
        <label class="form-label fw-bold"><i class="bi bi-tags"></i> Categoria</label>
        <select class="form-control shadow-sm" formControlName="categoria"
        [ngClass]="{'is-invalid': produtoForm.get('categoria')?.invalid && produtoForm.get('categoria')?.touched}">
          <option value="">Selecione uma categoria</option>
          <option value="Sanduiche">Sanduiche</option>
          <option value="Omelete">Omelete</option>
          <option value="Pao Sirio">Pão Sirio</option>
          <option value="Pizza">Pizza</option>
          <option value="Bebidas">Bebidas</option>
          <option value="Adicional">Adicional</option>
        </select>
        <div class="invalid-feedback">
          <span *ngIf="produtoForm.get('categoria')?.invalid && produtoForm.get('categoria')?.touched">
            A categoria do produto é obrigatório
          </span>
        </div>
      </div>

      <div class="col-md-3 offset-md-1">
        <label class="form-label fw-bold"><i class="bi bi-box-seam"></i> Tamanho</label>
        <select class="form-control shadow-sm" formControlName="tamanho"
        [ngClass]="{'is-invalid': produtoForm.get('tamanho')?.invalid && produtoForm.get('tamanho')?.touched}">
          <option value="">Selecione o tamanho do produto</option>
          <option value="Pequeno">Pequeno</option>
          <option value="Medio">Médio</option>
          <option value="Grande">Grande</option>
        </select>
        <div class="invalid-feedback">
          <span *ngIf="produtoForm.get('tamanho')?.invalid && produtoForm.get('tamanho')?.touched">
            O tamanho do produto é obrigatório
          </span>
        </div>
      </div>
    </div>

    <div class="d-flex mt-4 gap-3 mb-3">
      <button class="btn btn-success w-50 shadow-sm" type="submit">
        <i class="bi bi-save"></i> {{btnAcao}}
      </button>
      <a class="btn btn-info w-50 shadow-sm" routerLink="/produtos">
        <i class="bi bi-arrow-return-left"></i> Voltar
      </a>
    </div>
  </form>
</div>
