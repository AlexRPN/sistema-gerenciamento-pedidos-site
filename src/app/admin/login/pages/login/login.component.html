<div class="d-flex justify-content-center align-items-center vh-100">
  <div class="card login-card" style="width: 100%; max-width: 400px;">
    <h3 class="text-center mb-4">Login</h3>

    <form [formGroup]="loginForm" (ngSubmit)="login()">
      <div class="mb-3">
        <label class="form-label fw-bold"><i class="bi bi-person"></i> Usuário:</label>
        <input type="text" class="form-control shadow-sm" formControlName="nomeUsuario"
               placeholder="Insira o usuário"
               [ngClass]="{'is-invalid': loginForm.get('nomeUsuario')?.invalid && loginForm.get('nomeUsuario')?.touched}">
        <div class="invalid-feedback" *ngIf="loginForm.get('nomeUsuario')?.invalid && loginForm.get('nomeUsuario')?.touched">
          Digite um usuário válido
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label fw-bold"><i class="bi bi-lock"></i> Senha:</label>
        <input type="password" class="form-control shadow-sm" formControlName="senha"
               placeholder="Insira a senha"
               [ngClass]="{'is-invalid': loginForm.get('senha')?.invalid && loginForm.get('senha')?.touched}">
        <div class="invalid-feedback" *ngIf="loginForm.get('senha')?.invalid && loginForm.get('senha')?.touched">
          A senha é obrigatória
        </div>
      </div>

      <div class="d-flex flex-wrap justify-content-center">
        <button type="submit" class="btn btn-primary w-50">Entrar</button>
        <button type="button" class="btn btn-outline-info w-50" style="margin-top: 0.5rem;">Criar usuário</button>
      </div>
    </form>
  </div>
</div>
