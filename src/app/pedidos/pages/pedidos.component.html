<div class="container-fluid" style="padding: 0;">
  <h1 style="color: #fff;">Pedidos</h1>

  <div class="filtros" style="display: flex; flex-direction: column; background: #fff; border-radius: 16px 16px 0 0; padding: 16px 24px 8px 24px; margin-bottom: 0;">
    <div style="display: flex; gap: 16px; align-items: flex-end;">
      <mat-form-field appearance="outline" style="flex: 1; min-width: 120px;">
        <mat-label>ID Pedido</mat-label>
        <input matInput [(ngModel)]="filtroIdPedido" placeholder="Filtrar por ID">
      </mat-form-field>

      <mat-form-field appearance="outline" style="flex: 2; min-width: 180px;">
        <mat-label>Nome do Cliente</mat-label>
        <input matInput [(ngModel)]="filtroNomeCliente" placeholder="Filtrar por Cliente">
      </mat-form-field>

      <mat-form-field appearance="outline" style="flex: 1.5; min-width: 160px;">
        <mat-label>Status</mat-label>
        <mat-select [(ngModel)]="filtroStatus" panelClass="white-dropdown">
          <mat-option value="">Todos</mat-option>
          <mat-option value="Em Preparacao">Em Preparação</mat-option>
          <mat-option value="Pronto Para Retirada">Pronto Para Retirada</mat-option>
          <mat-option value="AguardandoEntrega">Aguardando Entrega</mat-option>
          <mat-option value="Em Rota">Em Rota</mat-option>
          <mat-option value="Entregue">Entregue</mat-option>
          <mat-option value="Cancelado">Cancelado</mat-option>
        </mat-select>
      </mat-form-field>

      <mat-form-field appearance="outline" style="flex: 2; min-width: 200px;">
        <mat-label>Período</mat-label>
        <mat-date-range-input [rangePicker]="picker">
          <input matStartDate placeholder="Data inicial" [(ngModel)]="filtroDataInicio">
          <input matEndDate placeholder="Data final" [(ngModel)]="filtroDataFim">
        </mat-date-range-input>
        <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
        <mat-date-range-picker #picker panelClass="white-dropdown"></mat-date-range-picker>
      </mat-form-field>
    </div>
    <div style="display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px;">
      <button class="btn btn-primary" [routerLink]="['/criar-pedido']">
        <i class="bi bi-plus-circle"></i> Novo Pedido
      </button>
      <button class="btn btn-success" (click)="exportarExcel()">
        <i class="bi bi-file-earmark-excel"></i> Exportar Excel
      </button>
    </div>
  </div>

  <table mat-table [dataSource]="pedidosFiltrados()" class="mat-elevation-z8" style="width: 100%; background: #fff; border-radius: 0 0 16px 16px;">
    <!-- ID Pedido -->
    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef>ID Pedido</th>
      <td mat-cell *matCellDef="let pedido">{{ pedido.id }}</td>
    </ng-container>

    <!-- Nome do Cliente -->
    <ng-container matColumnDef="cliente">
      <th mat-header-cell *matHeaderCellDef>Cliente</th>
      <td mat-cell *matCellDef="let pedido">{{ pedido.cliente.nome }}</td>
    </ng-container>

    <!-- Data do Pedido -->
    <ng-container matColumnDef="dataPedido">
      <th mat-header-cell *matHeaderCellDef>Data do Pedido</th>
      <td mat-cell *matCellDef="let pedido">{{ pedido.dataPedido | date: 'dd/MM/yyyy' }}</td>
    </ng-container>

    <!-- Status -->
    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef>Status</th>
      <td mat-cell *matCellDef="let pedido">
        <span [ngStyle]="{
          'padding': '4px 8px',
          'border-radius': '4px',
          'color': '#fff',
          'background-color':
            pedido.statusPedido === 'Cancelado' ? '#dc3545' :
            pedido.statusPedido === 'Pronto Para Retirada' ? '#fd7e14' :
            pedido.statusPedido === 'Em Preparacao' ? '#0dcaf0' :
            pedido.statusPedido === 'AguardandoEntrega' ? '#ffc107' :
            pedido.statusPedido === 'Em Rota' ? '#6f42c1' :
            pedido.statusPedido === 'Entregue' ? '#198754' : '#6c757d'
        }">
          {{ pedido.statusPedido }}
        </span>
      </td>
    </ng-container>

    <!-- Ações -->
    <ng-container matColumnDef="acoes">
      <th mat-header-cell *matHeaderCellDef>Ações</th>
      <td mat-cell *matCellDef="let pedido">
        <button class="btn btn-secondary"  style="margin-right: 10px;" (click)="exibirDetalhes(pedido)" placeholder="Exibir Detalhes">
          <i class="bi bi-chevron-right"></i>
        </button>
        <button class="btn btn-danger"  (click)="cancelarPedido(pedido)" placeholder="Cancelar Pedido">
          <i class="bi bi-x-octagon"></i>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="['id', 'cliente', 'dataPedido', 'status', 'acoes']"></tr>
    <tr mat-row *matRowDef="let row; columns: ['id', 'cliente', 'dataPedido', 'status', 'acoes'];"></tr>
  </table>
  <mat-paginator style="background: #fff;" [pageSizeOptions]="[5, 10, 25, 100]" showFirstLastButtons aria-label="Selecione a página de pedidos"></mat-paginator>
</div>
