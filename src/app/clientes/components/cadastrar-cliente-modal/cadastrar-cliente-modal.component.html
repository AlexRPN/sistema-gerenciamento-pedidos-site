<h1 class="titulo-cadastro">
  <i class="bi bi-person-add"></i> {{descTitulo}}
</h1>
<form #formCliente="ngForm" (ngSubmit)="cadastrarCliente()">
  <div class="form-group">
    <label class="form-label fw-bold">
      <i class="bi bi-person"></i> Nome
    </label>
    <input type="text" class="form-control shadow-sm" name="nome" [(ngModel)]="cliente.nome" placeholder="Digite o nome do cliente" required />
  </div>
  <div class="form-group">
    <label class="form-label fw-bold">
      <i class="bi bi-telephone"></i> Telefone
    </label>
    <input type="text" class="form-control shadow-sm" name="telefone" [(ngModel)]="cliente.telefone" placeholder="Digite o telefone" required />
  </div>
  <div class="form-row">
    <div class="form-group cep-group">
      <label class="form-label fw-bold d-flex align-items-center" style="font-size: 0.9rem;">
        <i class="bi bi-123 me-1"></i> CEP
      </label>
      <input type="text" class="form-control shadow-sm" name="cep" [(ngModel)]="cliente.endereco.cep" placeholder="Digite o CEP" required />
    </div>
    <div class="form-group logradouro-group">
      <label class="form-label fw-bold d-flex align-items-center">
        <i class="bi bi-geo-alt me-1"></i> Logradouro
      </label>
      <input type="text" class="form-control shadow-sm" name="logradouro" [(ngModel)]="cliente.endereco.logradouro" placeholder="Digite o logradouro" required />
    </div>
  </div>
  <div class="form-group">
    <label class="form-label fw-bold">
      <i class="bi bi-building"></i> Complemento
    </label>
    <input type="text" class="form-control shadow-sm" name="complemento" [(ngModel)]="cliente.endereco.complemento" placeholder="Digite o complemento" />
  </div>
  <div class="botoes-cadastro">
    <button class="btn btn-success" type="submit" [disabled]="formCliente.invalid">
      <i class="bi bi-save"></i> {{btnAcao}}
    </button>
    <a class="btn btn-secondary" (click)="fecharModal()">
      <i class="bi bi-x-circle"></i> Fechar
    </a>
  </div>
</form>
