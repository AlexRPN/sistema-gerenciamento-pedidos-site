<mat-sidenav-container class="sidenav-container">
  <mat-sidenav #sidenav mode="over" position="end" [opened]="carrinhoAberto" [fixedInViewport]="true" [autoFocus]="false" class="sidebar">
    <app-carrinho-produtos-sidebar
      [itensCarrinho]="itensCarrinho"
      (fechar)="fecharCarrinho()">
    </app-carrinho-produtos-sidebar>
  </mat-sidenav>

  <div class="container-cardapio">
    <header>
      <div class="left-space"></div>
      <h1><a href="https://www.seusite.com" target="_blank" rel="noopener noreferrer">PIT MANIA</a></h1>
      <div class="icons">
        <button class="icon-btn" id="cartBtn" (click)="abrirCarrinho()">
          🛒
          <span class="cart-count" style="background-color: black;" *ngIf="quantidadeTotalCarrinho > 0">{{quantidadeTotalCarrinho}}</span>
        </button>
      </div>
    </header>

    <main>
      <h1>Nosso Menu</h1>
      <mat-tab-group (selectedTabChange)="onTabChange($event)" [dynamicHeight]="true" animationDuration="200ms" style="width: 100%; margin-top: 15px;">
        <ng-container *ngFor="let tab of asyncTabs | async; let idx = index;">
          <mat-tab [label]="tab.label">
            <!-- Se for a aba de Pizza, exibe os botões de tamanho -->
            <div *ngIf="tab.label === 'Pizza' && abaSelecionada === idx">
              <div class="pizza-tamanhos-btns" style="margin-top: 20px;">
                <button *ngFor="let t of tamanhosPizza"
                  [ngClass]="{'active': t.nome === tamanhoPizzaSelecionado}"
                  (click)="tamanhoPizzaSelecionado = t.nome">
                  <span style="font-weight: bold; text-transform: uppercase; text-align: center;">
                    {{ mapTamanhoExibicao[t.nome] || t.nome }}
                  </span>
                </button>
              </div>
              <div class="menu-grid-mat" style="margin-top: 20px;">
                <mat-card class="menu-mat-card" *ngFor="let produto of pizzasFiltradas(); trackBy: trackByProdutoId">
                  <img mat-card-image [src]="getUrlImagem(produto.imagem)" [alt]="produto.nome" />
                  <mat-card-header>
                    <mat-card-title>{{produto.nome}} - {{produto.tamanho}}</mat-card-title>
                  </mat-card-header>
                  <mat-card-content>
                    <p>{{produto.descricao}}</p>
                    <div class="price">R$ {{produto.valor | number:'1.2-2'}}</div>
                  </mat-card-content>
                  <mat-card-actions>
                    <button mat-raised-button color="primary" (click)="adicionarAoCarrinho(produto)">Adicionar ao Carrinho</button>
                  </mat-card-actions>
                </mat-card>
              </div>
              <div *ngIf="pizzasFiltradas().length === 0" style="text-align:center; color: #888; margin: 32px 0; width: 100%;">
                Nenhuma pizza encontrada para este tamanho.
              </div>
            </div>
            <!-- Outras categorias -->
            <div *ngIf="tab.label !== 'Pizza'">
              <div *ngIf="produtos.length > 0; else semProdutos" class="menu-grid-mat" style="margin-top: 20px;">
                <ng-container *ngFor="let produto of produtos; trackBy: trackByProdutoId">
                  <mat-card class="menu-mat-card">
                    <img mat-card-image [src]="getUrlImagem(produto.imagem)" [alt]="produto.nome" />
                    <mat-card-header>
                      <mat-card-title>{{produto.nome}}</mat-card-title>
                    </mat-card-header>
                    <mat-card-content>
                      <p>{{produto.descricao}}</p>
                      <div class="price">R$ {{produto.valor | number:'1.2-2'}}</div>
                    </mat-card-content>
                    <mat-card-actions>
                      <button mat-raised-button color="primary" (click)="adicionarAoCarrinho(produto)">Adicionar ao Carrinho</button>
                    </mat-card-actions>
                  </mat-card>
                </ng-container>
              </div>
              <ng-template #semProdutos>
                <div style="text-align:center; color: #888; margin: 32px 0;">
                  Nenhum produto encontrado para esta categoria.
                </div>
              </ng-template>
            </div>
          </mat-tab>
        </ng-container>
      </mat-tab-group>
      <!-- <a href="https://wa.me/TELEFONE" id="whatsappBtn" class="floating-btn">
        <i class="bi bi-whatsapp"></i>
      </a>
      <div id="whatsappPopup" class="whatsapp-popup">Dúvidas? Entre em contato!</div>
      <a id="scrollTopBtn" class="floating-btn">
        <i class="bi bi-arrow-up"></i>
      </a> -->
    </main>
  </div>
</mat-sidenav-container>
