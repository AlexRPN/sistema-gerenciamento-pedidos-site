<div class="">
  <div class="modal-header" style="display: flex; justify-content: space-between; align-items: center;">
    <h2 style="margin-bottom: 30px;"><i class="bi bi-cart"></i> Seu Carrinho</h2>
    <button class="btn btn-secondary" (click)="fechar.emit()" aria-label="Fechar">
      <i class="bi bi-x-circle"></i>
    </button>
  </div>

  <div class="modal-content">
    <div class="info-section d-flex justify-content-between align-items-center" style="display: flex; justify-content: space-between; align-items: center;">
      <h3 style="margin: 0;">Produtos Selecionados</h3>
      <button class="btn btn-outline-danger btn-sm" (click)="removerTodosProdutos()" [disabled]="itensCarrinho.length === 0">
        <i class="bi bi-trash"></i> Remover Todos
      </button>
    </div>
    <div *ngIf="itensCarrinho && itensCarrinho.length > 0; else vazio">
      <div *ngFor="let item of itensCarrinho" class="cart-item show">
        <div class="cart-item-details">
          <h4>{{item.nome}}</h4>
          <p>{{item.descricao}}</p>
          <span style="font-weight: bold; color: #222;">R$ {{item.valor | number:'1.2-2'}}</span>
          <div style="display: flex; align-items: center; gap: 8px; margin: 8px 0;">
            <button class="btn btn-light btn-sm" (click)="alterarQuantidade(item, -1)"><i class="bi bi-dash"></i></button>
            <span>{{item.quantidade}}</span>
            <button class="btn btn-light btn-sm" (click)="alterarQuantidade(item, 1)"><i class="bi bi-plus"></i></button>
          </div>
          <textarea class="obs-field" [(ngModel)]="item.observacao" placeholder="Deseja remover algum ingrediente?"></textarea>
        </div>
      </div>
      <div class="info-section" style="font-size: 18px; margin-bottom: 16px;">
        <strong>Total do Pedido:</strong> R$ {{calcularTotal() | number:'1.2-2'}}
      </div>
      <div style="display: flex; justify-content: center;">
        <button class="finalize-btn">FINALIZAR PEDIDO</button>
      </div>
    </div>
    <ng-template #vazio>
      <p style="text-align:center; color:#888; margin: 32px 0;">Seu carrinho está vazio.</p>
    </ng-template>
  </div>
</div>
